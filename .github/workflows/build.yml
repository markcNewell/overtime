# Builds the Windows and macOS apps. Push a tag like v0.1.0 (or
# v0.1.0-alpha.1 for a pre-release) to publish them as a GitHub release, or
# run it by hand from the Actions tab to get the installers as artifacts.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# GitHub sometimes starts two runs for one tag; let them queue, not race.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      # One platform failing shouldn't throw away the other's build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # No certificates: Windows builds are unsigned, macOS ones ad-hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: overtime-${{ matrix.os }}
          # latest*.yml and .blockmap files let installed apps update themselves.
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a hyphen (v0.1.0-alpha.1) are pre-releases.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          A tiny cartoon developer for the corner of your screen. You'll need
          [Claude Code](https://claude.com/claude-code) installed and logged in.

          **Windows:** download `Overtime-Setup-*.exe` to install it; the installed
          app updates itself. `Overtime-*-portable.exe` runs without installing but
          can't update itself (it tells you when there's a new one). SmartScreen
          may warn about an unknown publisher: click **More info → Run anyway**.

          **macOS:** download the `-arm64.dmg` for Apple Silicon (M1 and later) or
          the plain `.dmg` for Intel, and drag Overtime to Applications. It isn't
          notarised, so the first launch is blocked: open **System Settings →
          Privacy & Security** and click **Open Anyway** (or run
          `xattr -dr com.apple.quarantine /Applications/Overtime.app`). When a new
          version is out it tells you and opens the download.

          It lives in the tray / menu bar. Show or hide the worker with
          Ctrl+Alt+Shift+O (⌘⌥⇧O on a Mac).
          EOF
          # A re-run (or a duplicate run) refreshes the files instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Overtime $TAG" \
              --notes-file notes.md \
              $pre
          fi
