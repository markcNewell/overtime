<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Overtime: The Office</title>
    <link rel="stylesheet" href="office.css" />
  </head>
  <body>
    <div class="panel">
      <header class="masthead">
        <img class="logo" src="../../assets/icon.png" alt="" />
        <div class="titles">
          <h1>Pointless Apps Ltd</h1>
          <p class="subtitle" id="summary">The boss's office</p>
        </div>
        <span class="brain" id="brain"></span>
        <button class="close" id="close" aria-label="Close" title="Close (Esc)">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <nav class="tabs" id="tabs">
        <button data-tab="hire">Hire</button>
        <button data-tab="projects">Projects</button>
        <button data-tab="staff">Staff</button>
        <button data-tab="inbox">Inbox<span class="count" id="inbox-count" hidden></span></button>
        <button data-tab="chat">Log</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <main id="content"></main>
    </div>
    <script src="office.js"></script>
  </body>
</html>
